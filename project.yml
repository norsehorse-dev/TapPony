name: TapPony
options:
  bundleIdPrefix: com.tappony
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

packages:
  TapPonyKit:
    path: Packages/TapPonyKit

targets:
  TapPony:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TapPonyKit
        product: TapPonyKit
      - sdk: CoreNFC.framework
      - target: TapPonyWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TapPony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NFCReaderUsageDescription: "TapPony reads the tags you scan and sends their details to the server you set up."
        NSLocalNetworkUsageDescription: "TapPony sends scans to servers on your local network, such as Home Assistant, when a profile points there."
        com.apple.developer.nfc.readersession.felica.systemcodes: ["12FC", "88B4", "0003", "FE00"]
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: ["D2760000850101"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            home.arpa:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tappony.app
            CFBundleURLSchemes: [tappony]
    entitlements:
      path: App/TapPony.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tappony.app
        PRODUCT_NAME: TapPony
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "4AVJZV35G8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TapPonyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TapPony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tappony.app.widgets
        PRODUCT_NAME: TapPonyWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "4AVJZV35G8"
        SKIP_INSTALL: YES

schemes:
  TapPony:
    build:
      targets:
        TapPony: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
